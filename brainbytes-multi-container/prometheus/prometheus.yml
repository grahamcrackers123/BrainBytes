global:
  scrape_interval: 15s

rule_files:
  - "recording_rules.yml"
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'backend'
    scrape_interval: 5s
    scrape_timeout: 4s
    sample_limit: 1000
    static_configs:
      - targets: ['backend:3000']
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):.*'
        target_label: instance_name
        replacement: '${1}'
      - source_labels: [job]
        target_label: service
        replacement: 'brainbytes-backend'