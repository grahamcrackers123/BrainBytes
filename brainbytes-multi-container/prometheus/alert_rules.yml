groups:
  # APP HEALTH
  - name: application_health
    rules:
      - alert: HighAIResponseLatency
        expr: histogram_quantile(0.95, rate(brainbytes_ai_response_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI response time is high"
          description: "95th percentile AI response duration has exceeded 5 seconds for 2 minutes. See the 'Response Time Trends' panel."

      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "Prometheus cannot reach the backend service for 1 minute. See the 'App Status' panel."

      - alert: HighErrorRate
        expr: sum(rate(brainbytes_http_requests_total{status=~"5.."}[5m])) / sum(rate(brainbytes_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate"
          description: "More than 5% of requests are returning 5xx errors over the last 5 minutes. See the 'Error Rate' panel."

      - alert: HighErrorRateCritical
        expr: sum(rate(brainbytes_http_requests_total{status=~"[45].."}[5m])) / sum(rate(brainbytes_http_requests_total[5m])) * 100 > 5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Error rate in the red zone"
          description: "Error rate has crossed the 5% red threshold shown on the dashboard's Error Rate panel."

  # RESOURCE ALERT
  - name: resource_usage
    rules:
      - alert: HighBackendCPUWarning
        expr: rate(process_cpu_seconds_total{job="backend"}[5m]) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage in the yellow zone"
          description: "Backend CPU is at {{ $value | printf \"%.1f\" }}%, matching the gauge's yellow (70%) threshold."

      - alert: HighBackendCPUCritical
        expr: rate(process_cpu_seconds_total{job="backend"}[5m]) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU usage in the red zone"
          description: "Backend CPU is at {{ $value | printf \"%.1f\" }}%, matching the gauge's red (90%) threshold."

      - alert: HighBackendMemoryWarning
        expr: process_resident_memory_bytes{job="backend"} > 300000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage in the yellow zone"
          description: "Backend memory is at {{ $value | humanize1024 }}B, matching the gauge's yellow (300MB) threshold. Adjust this threshold in both the alert and the dashboard gauge once you confirm your actual memory ceiling."

      - alert: HighBackendMemoryCritical
        expr: process_resident_memory_bytes{job="backend"} > 450000000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory usage in the red zone"
          description: "Backend memory is at {{ $value | humanize1024 }}B, matching the gauge's red (450MB) threshold."