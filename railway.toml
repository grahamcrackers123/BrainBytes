[build]
builder = "DOCKERFILE"
dockerfilePath = "brainbytes-multi-container/backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service]
name = "backend"
build = { dockerfilePath = "brainbytes-multi-container/backend/Dockerfile" }
deploy = { healthcheckPath = "/health", startCommand = "npm start" }

[[backend.env]]
name = "NODE_ENV"
value = "production"

[[backend.env]]
name = "PORT"
value = "3000"

[service]
name = "frontend"
build = { dockerfilePath = "brainbytes-multi-container/frontend/Dockerfile" }
deploy = { healthcheckPath = "/", startCommand = "npm start" }

[[frontend.env]]
name = "NEXT_PUBLIC_API_URL"
value = "${BACKEND_URL}"

[[frontend.env]]
name = "NODE_ENV"
value = "production"
